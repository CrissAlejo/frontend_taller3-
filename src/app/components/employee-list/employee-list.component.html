<table class="table table-striped">
  <thead><tr><th>Nombre</th><th>Cargo</th><th>Departamento</th><th>Sueldo</th><th>Operaciones</th></tr></thead>
  <tbody>
    <tr *ngFor="let employee of employees; trackBy: trackById">
      <td>{{ employee.nombre }}</td><td>{{ employee.cargo }}</td><td>{{ employee.departamento }}</td><td>{{ employee.sueldo | number:'1.2-2' }}</td>
      <td><button type="button" class="btn btn-secondary" [disabled]="busy" (click)="edit.emit(employee)">Actualizar</button>
        <button type="button" class="btn btn-danger" [disabled]="busy" (click)="remove.emit(employee)">Eliminar</button></td>
    </tr>
    <tr *ngIf="!employees.length"><td colspan="5">No hay empleados registrados.</td></tr>
  </tbody>
</table>
