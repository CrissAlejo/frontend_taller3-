<div class="card">
  <div class="card-body">
    <h1>{{ employee ? 'Editar empleado' : 'Registrar empleado' }}</h1>
    <form #form="ngForm" (ngSubmit)="submit(form)">
      <fieldset [disabled]="busy">
        <div class="form-group"><label for="nombre">Nombre</label>
          <input id="nombre" class="form-control" name="nombre" [(ngModel)]="draft.nombre" required minlength="3"
            maxlength="150" pattern=".*\S.*">
        </div>
        <div class="form-group"><label for="cargo">Cargo</label>
          <input id="cargo" class="form-control" name="cargo" [(ngModel)]="draft.cargo" required maxlength="150"
            pattern=".*\S.*">
        </div>
        <div class="form-group"><label for="departamento">Departamento</label>
          <input id="departamento" class="form-control" name="departamento" [(ngModel)]="draft.departamento" required
            maxlength="150" pattern=".*\S.*">
        </div>
        <div class="form-group"><label for="sueldo">Sueldo</label>
          <input id="sueldo" class="form-control" type="number" name="sueldo" [(ngModel)]="draft.sueldo" required
            min="0" step="0.01">
        </div>
        <button type="submit" class="btn btn-primary" [disabled]="form.invalid">{{ employee ? 'Guardar cambios' :
          'Crear' }}</button>
        <button type="button" class="btn btn-secondary" (click)="cancel.emit()">Limpiar</button>
      </fieldset>
    </form>
  </div>
</div>
