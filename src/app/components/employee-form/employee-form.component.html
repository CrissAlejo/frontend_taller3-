<section class="card">
  <div class="card-content">
    <h2 class="card-title">{{ employee ? 'Editar empleado' : 'Registrar empleado' }}</h2>
    <form #form="ngForm" (ngSubmit)="submit(form)">
      <div class="row">
        <div class="col s12 m6"><label for="nombre">Nombre</label>
          <input id="nombre" name="nombre" [(ngModel)]="draft.nombre" required minlength="3"
            maxlength="150" pattern=".*\S.*" [disabled]="busy">
        </div>
        <div class="col s12 m6"><label for="cargo">Cargo</label>
          <input id="cargo" name="cargo" [(ngModel)]="draft.cargo" required maxlength="150"
            pattern=".*\S.*" [disabled]="busy">
        </div>
        <div class="col s12 m6"><label for="departamento">Departamento</label>
          <input id="departamento" name="departamento" [(ngModel)]="draft.departamento" required
            maxlength="150" pattern=".*\S.*" [disabled]="busy">
        </div>
        <div class="col s12 m6"><label for="sueldo">Sueldo</label>
          <input id="sueldo" type="number" name="sueldo" [(ngModel)]="draft.sueldo" required
            min="0" step="0.01" [disabled]="busy">
        </div>
      </div>
      <button type="submit" class="btn waves-effect waves-light teal" [disabled]="form.invalid || busy">
        {{ employee ? 'Guardar cambios' : 'Crear empleado' }}</button>
      <button type="button" class="btn-flat waves-effect" [disabled]="busy" (click)="cancel.emit()">
        {{ employee ? 'Cancelar' : 'Limpiar' }}</button>
    </form>
  </div>
</section>
