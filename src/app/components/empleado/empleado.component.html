<div class="alert alert-danger" role="alert" *ngIf="error$ | async as error">{{ error }}</div>
<p role="status" *ngIf="loading$ | async">Procesando...</p>
<div class="row">
  <div class="col-md-4">
    <app-employee-form [employee]="selected" [resetVersion]="formVersion" [busy]="(loading$ | async) ?? false"
      (save)="save($event)" (cancel)="cancel()"></app-employee-form>
  </div>
  <div class="col-md-8">
    <app-employee-list [employees]="(employees$ | async) ?? []" [busy]="(loading$ | async) ?? false"
      (edit)="selected = $event" (remove)="remove($event)"></app-employee-list>
  </div>
</div>
