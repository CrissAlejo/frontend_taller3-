<section class="card p-4 shadow-sm" aria-labelledby="login-title">
  <h1 id="login-title">Acceso al laboratorio</h1>
  <form #form="ngForm" (ngSubmit)="onSubmit(form)">
    <fieldset [disabled]="isLoading">
      <div class="mb-3">
        <label for="email">Correo electrónico</label>
        <input id="email" class="form-control" type="email" name="email" autocomplete="username"
          [(ngModel)]="formModel.email" #email="ngModel" required email>
        <p *ngIf="email.invalid && (email.touched || form.submitted)">Ingresa un correo electrónico válido.</p>
      </div>
      <div class="mb-3">
        <label for="password">Contraseña</label>
        <input id="password" class="form-control" type="password" name="password" autocomplete="current-password"
          [(ngModel)]="formModel.password" #password="ngModel" required minlength="6">
        <p *ngIf="password.invalid && (password.touched || form.submitted)">La contraseña debe tener al menos 6 caracteres.</p>
      </div>
      <button class="btn btn-primary" type="submit" [disabled]="form.invalid || isLoading">
        {{ isLoading ? 'Validando...' : 'Iniciar sesión' }}
      </button>
    </fieldset>
  </form>
</section>
